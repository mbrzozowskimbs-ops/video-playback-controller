<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>video-playback-controller</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <h1>video-playback-controller</h1>
  <p class="intro">Twój program. Twoje tempo.</p>
  <div class="controls" aria-label="Przewijanie programu">
    <button data-seconds="-60">−1 min</button><button data-seconds="-10">−10 s</button>
    <button data-seconds="10">+10 s</button><button data-seconds="60">+1 min</button>
  </div>
  <button id="toggle" class="wide">Odtwarzaj / pauza</button>
  <form id="custom">
    <label for="seconds">Własny skok w sekundach</label>
    <div class="custom"><input id="seconds" type="number" min="1" max="900" step="1" value="30" required><button type="submit" name="direction" value="-1" aria-label="Cofnij o podaną liczbę sekund">Cofnij</button><button type="submit" name="direction" value="1">Dalej</button></div>
  </form>
  <p id="status" role="status" aria-live="polite">Łączenie z odtwarzaczem…</p>
  <details><summary>Skróty klawiaturowe</summary><p>Alt + Shift + ← / →: ±10 s<br>Alt + Shift + ↓ / ↑: ±1 min<br>Alt + Shift + spacja: pauza</p><p>Na Macu Alt to ⌥ Option. Skróty działają przy aktywnej karcie PLAY NOW, poza polami tekstowymi.</p></details>
  <p id="version" class="version"></p>
  <script src="popup.js"></script>
</body></html>
